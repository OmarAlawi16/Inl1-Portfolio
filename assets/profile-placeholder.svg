<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" role="img" aria-label="Stylized vector portrait of developer Alex Morgan with headphones">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Accent Halo Gradient -->
    <radialGradient id="halo-grad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Face Gradient -->
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Hoodie / Apparel Gradient -->
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Headphone Band Gradient -->
    <linearGradient id="headphone-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="280" height="280" rx="16" fill="url(#bg-grad)"/>

  <!-- 2. Ambient Glowing Halo -->
  <circle cx="140" cy="130" r="105" fill="url(#halo-grad)"/>

  <!-- 3. Geometric Background Tech Accents -->
  <circle cx="140" cy="130" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="140" cy="130" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Subtle Code Bracket Watermark in Background -->
  <text x="32" y="70" font-family="monospace" font-size="18" fill="#38bdf8" fill-opacity="0.2" font-weight="bold">&lt;/&gt;</text>
  <text x="216" y="210" font-family="monospace" font-size="18" fill="#38bdf8" fill-opacity="0.2" font-weight="bold">{ ; }</text>

  <!-- 4. Developer Avatar Group -->
  <g filter="url(#shadow)">
    <!-- Shoulders & Hoodie -->
    <path d="M 60 280 C 60 220, 88 198, 140 198 C 192 198, 220 220, 220 280 Z" fill="url(#hoodie-grad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Hoodie Inner Collar / Zipper -->
    <path d="M 124 200 L 140 235 L 156 200" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="140" y1="235" x2="140" y2="280" stroke="#334155" stroke-width="2"/>

    <!-- Neck -->
    <rect x="126" y="160" width="28" height="42" rx="4" fill="#fdba74"/>

    <!-- Head / Face -->
    <rect x="105" y="98" width="70" height="84" rx="28" fill="url(#skin-grad)"/>

    <!-- Glasses Frame -->
    <rect x="110" y="125" width="24" height="18" rx="5" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="146" y="125" width="24" height="18" rx="5" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="134" y1="132" x2="146" y2="132" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Glasses Glare -->
    <line x1="113" y1="129" x2="124" y2="139" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.75"/>
    <line x1="149" y1="129" x2="160" y2="139" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.75"/>

    <!-- Hair (Modern textured top) -->
    <path d="M 103 112 C 103 82, 120 74, 140 74 C 160 74, 177 82, 177 112 C 172 104, 160 102, 140 102 C 120 102, 108 104, 103 112 Z" fill="#1e293b"/>
    <path d="M 112 85 C 124 70, 154 68, 168 85 C 160 78, 140 76, 128 80 Z" fill="#334155"/>

    <!-- Smile -->
    <path d="M 132 160 Q 140 166 148 160" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>

    <!-- Over-Ear Headphones Arc -->
    <path d="M 94 135 C 94 90, 114 62, 140 62 C 166 62, 186 90, 186 135" fill="none" stroke="url(#headphone-grad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <rect x="88" y="122" width="14" height="34" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Right Ear Cup -->
    <rect x="178" y="122" width="14" height="34" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- 5. Floating Status Pill / Badge -->
  <g transform="translate(162, 22)">
    <rect width="94" height="26" rx="13" fill="#0b1120" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="14" cy="13" r="4.5" fill="#34d399"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#f8fafc" letter-spacing="0.3">LIA READY</text>
  </g>
</svg>
